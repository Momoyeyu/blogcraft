<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <g transform="translate(60 0)">

  <!-- mark: a pen nib mid-stroke, its trail finishing in a check -->
  <g transform="translate(275 200)">
    <g transform="rotate(-45) translate(0 -32)">
      <path d="M -38 -64 Q -58 4 0 88 Q 58 4 38 -64 Q 20 -74 0 -74 Q -20 -74 -38 -64 Z"
            fill="none" stroke="url(#mark)" stroke-width="22" stroke-linejoin="round"/>
      <path d="M 0 -6 L 0 76" fill="none" stroke="url(#mark)" stroke-width="12" stroke-linecap="round"/>
      <circle cx="0" cy="-16" r="13" fill="none" stroke="url(#mark)" stroke-width="14"/>
    </g>
    <path d="M 44 46 C 56 60 64 66 74 68 C 92 52 106 34 122 12"
          fill="none" stroke="url(#mark)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <line x1="500" y1="110" x2="500" y2="290" stroke="#047857" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round"/>

  <text x="560" y="222" font-family="'Helvetica Neue', 'SF Pro Display', Arial, sans-serif"
        font-weight="700" font-size="148" letter-spacing="-5" fill="#065F46">blog<tspan fill="url(#word)">craft</tspan></text>
  <text x="566" y="292" font-family="'Helvetica Neue', 'SF Pro Display', Arial, sans-serif"
        font-weight="500" font-size="44" letter-spacing="1" fill="#0F766E">Ship only what survives review</text>
  </g>
</svg>
